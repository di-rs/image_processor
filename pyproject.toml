[project]
name = "image-processor"
version = "0.1.0"
description = "Image processor workers runtime with REST API"
readme = "README.md"
authors = [
    { name = "Di P", email = "popov.dmitriiy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "dramatiq[rabbitmq]>=2.2.1,<3",
    "fastapi[standard]>=0.142.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pillow>=12.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.47",
]

[project.scripts]
image-processor = "image_processor:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "prek>=0.5.4",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
