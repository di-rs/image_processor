services:
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://image_processor:image_processor@db:5432/image_processor
      RABBITMQ_URL: amqp://image_processor:image_processor@rabbitmq:5672
      BLOB_STORAGE_PATH: /app/data/images
      UPLOAD_URL_TTL_SECONDS: "${UPLOAD_URL_TTL_SECONDS:-300}"
      DEBUG: "true"
    volumes:
      - image_data:/app/data/images
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec fastapi run src/image_processor/main.py --host 0.0.0.0 --port 8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: image_processor
      POSTGRES_USER: image_processor
      POSTGRES_PASSWORD: image_processor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U image_processor -d image_processor"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: image_processor
      RABBITMQ_DEFAULT_PASS: image_processor
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


volumes:
  postgres_data:
  rabbitmq_data:
  image_data:
