x-app-environment: &app-environment
  DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
  RABBITMQ_URL: "${RABBITMQ_URL:?Set RABBITMQ_URL in .env}"
  BLOB_STORAGE_PATH: "${BLOB_STORAGE_PATH:?Set BLOB_STORAGE_PATH in .env}"
  UPLOAD_URL_TTL_SECONDS: "${UPLOAD_URL_TTL_SECONDS:-300}"
  DEBUG: "${DEBUG:-false}"
  RABBITMQ_CONNECTION_TIMEOUT_SECONDS: "${RABBITMQ_CONNECTION_TIMEOUT_SECONDS:-10}"
  RABBITMQ_BLOCKED_CONNECTION_TIMEOUT_SECONDS: "${RABBITMQ_BLOCKED_CONNECTION_TIMEOUT_SECONDS:-10}"
  WORKER_FAILURE_BACKOFF_SECONDS: "${WORKER_FAILURE_BACKOFF_SECONDS:-5}"

services:
  web:
    build: .
    environment: *app-environment
    volumes:
      - "image_data:${BLOB_STORAGE_PATH:?Set BLOB_STORAGE_PATH in .env}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec fastapi run src/image_processor/main.py --host 0.0.0.0 --port 8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build: .
    command:
      - dramatiq
      - image_processor.workers.image_processing
      - --processes
      - "1"
      - --threads
      - "${WORKER_CONCURRENCY:-4}"
      - --worker-shutdown-timeout
      - "${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}"
    restart: on-failure
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-45s}
    environment: *app-environment
    volumes:
      - "image_data:${BLOB_STORAGE_PATH:?Set BLOB_STORAGE_PATH in .env}"
    depends_on:
      web:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


volumes:
  postgres_data:
  rabbitmq_data:
  image_data:
